name: Build and Deploy

on:
  push:
    branches:
      - main
      - arena/01a07b61-firebroxrc
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18'

jobs:
  # Test and lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint || true

      - name: Check syntax
        run: |
          for file in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$file" || exit 1
          done

  # Build frontend
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/
          retention-days: 7

  # Deploy to GitHub Pages (frontend only)
  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Deploy server to VPS (optional)
  deploy-server:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/firebrox-fps
            git pull origin main
            npm install --production
            pm2 restart firebrox-server
        if: ${{ secrets.SERVER_HOST != '' }}

  # Notify on completion
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-server]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          echo "Deployment completed!"
          echo "Frontend: https://alrickdaley8-cpu.github.io/Firebroxrc"
          echo "Server: ${{ secrets.SERVER_HOST || 'Not configured' }}"
